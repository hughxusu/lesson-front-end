<script>
Array.prototype.sumEvenIndex = function() {
    let sum = 0;
    this.forEach((item, index) => {
        if (index % 2 === 0) {
            sum += item;
        }
    })
    return sum;
}

let one = [1, 2, 3, 4, 5, 6];
console.log(one.sumEvenIndex());

let two = [11, 22, 33, 44, 55, 66];
console.log(two.sumEvenIndex());
</script>
