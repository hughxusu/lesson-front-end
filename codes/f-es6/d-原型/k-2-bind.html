<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Document</title>
</head>
<body>
	<button>发送验证码</button>
</body>
<script type="text/javascript">
let btn = document.querySelector('button');
btn.addEventListener('click', function() {
    this.disabled = true;
	function reset() {
		this.disabled = false;
	}

	setTimeout(reset.bind(this), 2000);
});
</script>
</html>
