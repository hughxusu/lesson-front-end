<script type="text/javascript">

function sumEvenOrOdd(isEven=true) {
    let sum = 0;
    this.forEach((item, index) => {
        if (isEven === true) {
			if (index % 2 === 0) {
				sum += item;
			}
		} else {
			if (index % 2 !== 0) {
				sum += item;
			}
        }
    })
    return sum;
}

let one = [1, 2, 3, 4, 5, 6];
console.log(sumEvenOrOdd.call(one));

let two = [11, 22, 33, 44, 55, 66];
console.log(sumEvenOrOdd.call(two, false));

</script>
