<script>
function * fibonacci(num) {
    let a = 0;
    let b = 1;
    while (num-- > 0) {
        yield a;
        [a, b] = [b, a + b];
    }
}

let fib = fibonacci(10);
for (let i of fib) {
    console.log(i);
}

</script>
