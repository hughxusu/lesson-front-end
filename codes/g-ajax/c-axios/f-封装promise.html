<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.18.1/axios.min.js" defer></script>
</head>
<body>
    <div><span>第一步操作</span>: <span id="first"></span></div>
    <div><span>第二步操作</span>: <span id="second"></span></div>
    <div><span>第三步操作</span>: <span id="third"></span></div>
    <button id="btn">开始操作</button>
</body>
<script defer>
let first = document.querySelector('#first');
let second = document.querySelector('#second');
let third = document.querySelector('#third');
let btn = document.querySelector('#btn');

function foo() {
    return new Promise(function(resolve, reject) {
        setTimeout(() => {
            resolve();
        }, 1000);
    });
}

btn.addEventListener('click', function() {
    foo().then(() => {
        first.innerHTML = '第一步操作完成';
        return foo();
    }).then(() => {
        second.innerHTML = '第二步操作完成';
        return foo();
    }).then(() => {
        third.innerHTML = '第三步操作完成';
    });
});
</script>
</html>
