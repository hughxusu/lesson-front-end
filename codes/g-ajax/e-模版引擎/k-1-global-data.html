<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <script defer src="https://cdn.bootcdn.net/ajax/libs/alpinejs/3.16.1/cdn.min.js"></script>
</head>
<body>
<div x-data="dropdown">
    <button @click="toggle">Toggle Content</button>
    <hr>
    <h2 x-show="open">
        登高 (杜甫) <br>
        风急天高猿啸哀，渚清沙白鸟飞回。<br>
        无边落木萧萧下，不尽长江滚滚来。<br>
        万里悲秋常作客，百年多病独登台。<br>
        艰难苦恨繁霜鬓，潦倒新停浊酒杯。
    </h2>
</div>
</body>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('dropdown', () => ({
            open: false,
            toggle() {
                this.open = ! this.open
            }
        }))
    })
</script>
</html>
