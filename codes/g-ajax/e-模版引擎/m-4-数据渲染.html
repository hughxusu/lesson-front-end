<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <script defer src="https://cdn.bootcdn.net/ajax/libs/axios/1.18.1/axios.min.js" ></script>
  <script defer src="https://cdn.bootcdn.net/ajax/libs/alpinejs/3.16.1/cdn.min.js"></script>
  <style>
    ul {
      padding: 0;
      margin: 0;
    }

    li {
      background-color: #409EFF;
      color: #fff;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
      list-style: none;
    }

    .name {
      font-weight: bold;
    }
  </style>
</head>
<body>
<div x-data="userList">
  <ul>
    <template x-for="user in users" :key="user.id">
      <li>
        <div class="name" x-text="fullName(user)"></div>
        <div x-text="`${user.gender} · ${user.age} · ${user.university}`"></div>
      </li>
    </template>
  </ul>
</div>
</body>
<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('userList', () => ({
      users: [],
      async init() {
        let res = await axios.get('https://dummyjson.com/users');
        this.users = res.data.users;
      },
      fullName(user) {
        return user.firstName + ' ' + user.lastName + ' ' + user.maidenName;
      }
    }))
  })
</script>
</html>
