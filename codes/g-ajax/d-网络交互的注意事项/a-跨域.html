<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.18.1/axios.min.js" defer></script>
    <style>
    </style>
</head>
<body>
  <input type="file" id="file-input" />
  <br />
  <button id="btn">上传文件</button>
  <br />
  <a href="" id="link" target="_blank" style="display: none;">查看图片</a>
  <br />
  <img id="img" src="" alt="" />
</body>
<script defer>
    let btn = document.querySelector('#btn');
    let link = document.querySelector('#link');
    let img = document.querySelector('#img');
    btn.addEventListener('click', function() {
        let files = document.querySelector('#file-input').files;
        if (files.length <= 0) {
            alert('请选择文件');
            return;
        }

        let file = files[0];
        console.log(file);
        let formData = new FormData();
        formData.append('file', file);

        axios.post('https://api.escuelajs.co/api/v1/files/upload', formData).then(function(response) {
            console.log(response.data);
            link.style.display = 'block';
            link.href = response.data.location;
            img.src = response.data.location;
        })
    })
</script>
</html>
